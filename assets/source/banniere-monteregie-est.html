<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --sq-bleu: #170A72;
      --sq-menthe: #90F1E9;
      --sq-sarcelle: #08A0A0;
      --sq-azur: #0080D7;
      --sq-font: 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1600px; height: 400px; overflow: hidden; }
    body {
      position: relative;
      background: linear-gradient(100deg, var(--sq-bleu) 0%, var(--sq-bleu) 42%, var(--sq-sarcelle) 100%);
      font-family: var(--sq-font);
    }
    .deco { position: absolute; border-radius: 50%; background: rgba(255,255,255,.08); }
    .deco.d1 { width: 900px; height: 900px; right: -320px; top: -260px; }
    .deco.d2 { width: 560px; height: 560px; right: -60px; top: 60px; background: rgba(255,255,255,.10); }
    .contenu { position: relative; z-index: 2; height: 100%; display: flex; align-items: center; padding-left: 96px; gap: 34px; }
    .pin { width: 110px; height: 110px; flex-shrink: 0; }
    .textes { display: flex; flex-direction: column; }
    .accroche { font-weight: 600; font-size: 38px; color: #fff; line-height: 1; margin-bottom: 8px; }
    .titre-ligne { display: flex; align-items: baseline; }
    .titre, .titre-est { font-weight: 800; font-size: 74px; color: #fff; line-height: 1; letter-spacing: .002em; }
    .titre-tiret { color: var(--sq-menthe); }
    .titre-est {
      background: linear-gradient(92deg, var(--sq-menthe) 0%, var(--sq-azur) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sstitre { font-weight: 700; font-size: 24px; color: #fff; letter-spacing: .22em; text-transform: uppercase; margin-top: 14px; }
    @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
      .titre-est { color: var(--sq-menthe); background: none; }
    }
  </style>
</head>
<body>
  <div class="deco d1"></div>
  <div class="deco d2"></div>
  <div class="contenu">
    <img class="pin" src="logo-blanc-point-rose.png" alt="">
    <div class="textes">
      <div class="accroche">Carte interactive</div>
      <div class="titre-ligne">
        <span class="titre">Montérégie</span><span class="titre titre-tiret">-</span><span class="titre-est">Est</span>
      </div>
      <div class="sstitre">PTEM 2027 &nbsp;·&nbsp; CLINIQUES EN RECRUTEMENT</div>
    </div>
  </div>
</body>
</html>
