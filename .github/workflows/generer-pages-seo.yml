# Régénération automatique des pages du site à partir de data.json / index.html
# ================================================================================
# Mis en place le 19 août 2026. Étendu le 20 août 2026 (copie Montérégie-Est).
#
# CE QUE ÇA FAIT
#   Dès que data.json est modifié sur GitHub (par le crayon « modifier » du site web, par un
#   téléversement, ou par n'importe quel autre moyen), ce robot :
#     1. régénère les 61 pages de cliniques, les 6 pages de RLS, le répertoire et sitemap.xml ;
#     2. vérifie qu'aucune donnée privée n'a fui dans les pages produites ;
#     3. publie le résultat directement sur le site.
#   Dès que index.html est modifié, ce robot recopie aussi ce même fichier vers
#   monteregie-est/index.html, monteregie-centre/index.html et monteregie-ouest/index.html (avec
#   le <head> — titre/description/canonical/Open Graph — et le lettrage du territoire adaptés ;
#   voir scripts/publier-regions.js). C'est la même application, les mêmes données : les trois
#   cartes régionales ne sont jamais maintenues à la main.
#   Il n'y a donc plus rien à faire à la main après avoir modifié data.json ou index.html : le
#   site se met à jour tout seul en une à deux minutes.
#
# CE QUE ÇA NE TOUCHE JAMAIS
#   data.json lui-même (le robot le lit, il ne l'écrit jamais), sw.js, ptem/, amp/.
#
# SI ÇA NE DÉMARRE PAS
#   Il faut autoriser une seule fois les robots à écrire dans le dépôt :
#   Settings → Actions → General → Workflow permissions → « Read and write permissions » → Save.
#
# POUR LE LANCER À LA MAIN
#   Onglet « Actions » du dépôt → « Régénérer les pages du site » → bouton « Run workflow ».
#   (Utile après avoir modifié le générateur, ou pour forcer une reconstruction.)

name: Régénérer les pages du site

on:
  push:
    paths:
      # Volontairement PAS « scripts/** » : le robot peut avoir à écrire scripts/slugs.json quand
      # une nouvelle clinique apparaît, et ce commit-là relancerait le robot en boucle sans fin.
      # On ne réagit donc qu'aux fichiers qui sont réellement des entrées : les deux qui
      # pilotaient déjà le robot, plus index.html (source de la copie Montérégie-Est).
      - 'data.json'
      - 'scripts/generer-pages-seo.js'
      - 'scripts/mettre-a-jour-date-donnees.js'
      - 'scripts/publier-regions.js'
      - '.github/workflows/generer-pages-seo.yml'
      - 'index.html'
      # /ptem/ et /amp/ sont écrites à la main, mais leurs copies étanches de l'univers
      # Montérégie-Est en sont dérivées : si on les modifie, les copies doivent suivre.
      - 'ptem/index.html'
      - 'amp/index.html'
  workflow_dispatch:

# Autorise ce robot à publier ses modifications dans le dépôt.
permissions:
  contents: write

# Si deux modifications de data.json arrivent coup sur coup, on ne garde que la dernière
# régénération plutôt que d'en lancer deux en parallèle qui se marcheraient dessus.
concurrency:
  group: generation-pages-seo
  cancel-in-progress: true

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dater automatiquement une nouvelle version de data.json
        env:
          EVENEMENT_GITHUB: ${{ github.event_name }}
          REVISION_AVANT: ${{ github.event.before }}
          REVISION_ACTUELLE: ${{ github.sha }}
        run: |
          set -e
          if [ "$EVENEMENT_GITHUB" = "workflow_dispatch" ]; then
            node scripts/mettre-a-jour-date-donnees.js
          elif git cat-file -e "$REVISION_AVANT^{commit}" 2>/dev/null \
            && git diff --name-only "$REVISION_AVANT" "$REVISION_ACTUELLE" -- data.json | grep -qx 'data.json'; then
            node scripts/mettre-a-jour-date-donnees.js
          elif ! git cat-file -e "$REVISION_AVANT^{commit}" 2>/dev/null; then
            node scripts/mettre-a-jour-date-donnees.js
          else
            echo "data.json n'a pas changé : sa date publique est conservée."
          fi

      - name: Mémoriser l'empreinte des données après la datation
        run: sha256sum data.json > "$RUNNER_TEMP/data-json-apres-date.sha256"

      - name: Régénérer les pages et le sitemap
        run: node scripts/generer-pages-seo.js

      - name: Recopier index.html vers les trois cartes régionales
        run: node scripts/publier-regions.js

      - name: Vérifier qu'aucune donnée privée n'a fui
        # Filet de sécurité : ce robot publie sans qu'un humain relise. Si le générateur venait à
        # être modifié de travers, on préfère que la publication ÉCHOUE plutôt qu'elle mette en
        # ligne des courriels nominatifs ou des notes personnelles.
        run: |
          set -e
          # Les mêmes vérifications portent sur les copies étanches des trois univers régionaux.
          # Les fichiers monteregie-*/index.html en sont volontairement EXCLUS : ce sont les
          # copies de l'application, qui contiennent l'adresse de contact du site — voulue,
          # pas une fuite.
          PAGES_GENEREES="cliniques/ rls/"
          for R in monteregie-est monteregie-centre monteregie-ouest; do
            PAGES_GENEREES="$PAGES_GENEREES $R/cliniques/ $R/rls/ $R/ptem/ $R/amp/"
          done
          echo "Recherche d'adresses courriel dans les pages générées..."
          if grep -rIEl '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' $PAGES_GENEREES ; then
            echo "::error::Une adresse courriel apparaît dans les pages générées. Publication annulée."
            exit 1
          fi
          echo "Recherche de champs internes (notes, posApprox, alias)..."
          if grep -rIl -e '"notes"' -e 'posApprox' -e '"alias"' $PAGES_GENEREES ; then
            echo "::error::Un champ interne apparaît dans les pages générées. Publication annulée."
            exit 1
          fi
          echo "Vérification de l'étanchéité de l'univers Montérégie-Est..."
          # Aucune page de /monteregie-est/ ne doit renvoyer vers la carte générale, vers le
          # répertoire des trois territoires ou vers un RLS hors Est. C'est LA garantie demandée
          # par le CISSS Montérégie-Est : on préfère ne rien publier plutôt que de la rompre.
          if grep -rIoE 'href="/(cliniques|rls|ptem|amp)/' monteregie-est/cliniques/ monteregie-est/rls/ monteregie-est/ptem/ monteregie-est/amp/ ; then
            echo "::error::Une page de /monteregie-est/ renvoie hors de l'univers Montérégie-Est. Publication annulée."
            exit 1
          fi
          echo "Vérification que le générateur n'a pas modifié data.json après sa datation..."
          sha256sum -c "$RUNNER_TEMP/data-json-apres-date.sha256"
          echo "Vérification du sitemap..."
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')"
          echo "Toutes les vérifications sont passées."

      - name: Publier si quelque chose a changé
        run: |
          set -e
          git config user.name  "Robot Trouve ta clinique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json cliniques rls sitemap.xml scripts/slugs.json monteregie-est monteregie-centre monteregie-ouest
          if git diff --cached --quiet ; then
            echo "Les pages étaient déjà à jour : rien à publier."
            exit 0
          fi
          git commit -m "Régénération des pages du site depuis data.json [automatique]"
          git push
          echo "Pages publiées."
