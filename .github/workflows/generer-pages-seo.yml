# Régénère uniquement les pages Montérégie-Est à partir de data.json.
name: Régénérer les pages Montérégie-Est

on:
  push:
    paths:
      - 'data.json'
      - 'scripts/generer-pages-seo.js'
      - 'scripts/mettre-a-jour-date-donnees.js'
      - '.github/workflows/generer-pages-seo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generation-pages-monteregie-est
  cancel-in-progress: true

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dater une nouvelle version des données
        env:
          EVENEMENT_GITHUB: ${{ github.event_name }}
          REVISION_AVANT: ${{ github.event.before }}
          REVISION_ACTUELLE: ${{ github.sha }}
        run: |
          set -e
          if [ "$EVENEMENT_GITHUB" = "workflow_dispatch" ]; then
            node scripts/mettre-a-jour-date-donnees.js
          elif git cat-file -e "$REVISION_AVANT^{commit}" 2>/dev/null \
            && git diff --name-only "$REVISION_AVANT" "$REVISION_ACTUELLE" -- data.json | grep -qx 'data.json'; then
            node scripts/mettre-a-jour-date-donnees.js
          elif ! git cat-file -e "$REVISION_AVANT^{commit}" 2>/dev/null; then
            node scripts/mettre-a-jour-date-donnees.js
          else
            echo "data.json n'a pas changé : sa date publique est conservée."
          fi

      - name: Mémoriser les données datées
        run: sha256sum data.json > "$RUNNER_TEMP/data-json-apres-date.sha256"

      - name: Régénérer les pages
        run: node scripts/generer-pages-seo.js

      - name: Vérifier les données et les pages actives de Montérégie-Est
        run: |
          set -e
          test ! -e CNAME
          node <<'NODE'
          const fs = require('fs');
          const data = require('./data.json');
          const slugs = require('./scripts/slugs.json');
          const rls = ['pierre-boucher', 'pierre-de-saurel', 'richelieu-yamaska'];
          if (data.cliniques.some(x => x.region !== 'Est')) throw new Error('Territoire hors Est dans data.json.');
          if ((data.hopitaux || []).some(x => x.region && x.region !== 'Est')) throw new Error('Hôpital hors Est dans data.json.');
          if (data.cliniques.filter(x => x.categorie === 'etablissement').length !== 7) throw new Error('Le prototype doit contenir 7 établissements.');
          if ((data.hopitaux || []).length !== 3) throw new Error('Le prototype doit contenir 3 hôpitaux.');

          const pages = [
            'cliniques/index.html',
            'rls/index.html',
            ...data.cliniques
              .filter(x => x.visible !== false && x.categorie !== 'etablissement')
              .map(x => `cliniques/${slugs[String(x.id)]}/index.html`),
            ...rls.map(slug => `rls/${slug}/index.html`)
          ];
          for (const fichier of pages) {
            if (!fs.existsSync(fichier)) throw new Error(`Page active absente : ${fichier}`);
            const html = fs.readFileSync(fichier, 'utf8');
            if (!html.includes('name="robots" content="noindex,nofollow,noarchive"')) throw new Error(`Noindex absent : ${fichier}`);
            if (/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/.test(html)) throw new Error(`Courriel public dans : ${fichier}`);
            if (/"notes"|posApprox|"alias"/.test(html)) throw new Error(`Champ interne dans : ${fichier}`);
            if (/trouvetaclinique\.ca|monteregie-centre|monteregie-ouest/i.test(html)) throw new Error(`URL étrangère dans : ${fichier}`);
          }
          const racine = fs.readFileSync('index.html', 'utf8');
          if (/Kaushan/i.test(racine)) throw new Error('Police cursive encore présente dans la carte active.');
          if (/trouvetaclinique\.ca|monteregie-centre|monteregie-ouest/i.test(racine)) throw new Error('URL étrangère dans la carte active.');
          NODE
          sha256sum -c "$RUNNER_TEMP/data-json-apres-date.sha256"
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')"

      - name: Publier les pages générées
        run: |
          set -e
          git config user.name "Robot Trouve ta clinique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json cliniques rls sitemap.xml scripts/slugs.json
          if git diff --cached --quiet; then
            echo "Les pages sont déjà à jour."
            exit 0
          fi
          git commit -m "Régénération des pages Montérégie-Est [automatique]"
          git push
